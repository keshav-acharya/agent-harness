[project]
name = "harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["anthropic", "openai", "groq" , "jsonschema", "python-dotenv"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
harness = "harness.cli:main"
harness-trace = "harness.summarize:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.ruff]
line-length = 100